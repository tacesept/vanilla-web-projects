<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Color Palette Generator</h1>

      <button class="generate-btn">
        <i class="fa-solid fa-arrows-rotate"></i>
        Generate Palette
      </button>

      <section class="palette-container">
        <article class="color-card">
          <div class="color-preview" style="background-color: #e1f5fe"></div>
          <div class="color-details">
            <span class="hex">#E1F5FE</span>
            <button class="copy-btn" title="Copy color">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </article>
        <article class="color-card">
          <div class="color-preview" style="background-color: #b3e5fc"></div>
          <div class="color-details">
            <span class="hex">#B3E5FC</span>
            <button class="copy-btn" title="Copy color">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </article>
        <article class="color-card">
          <div class="color-preview" style="background-color: #81d4fa"></div>
          <div class="color-details">
            <span class="hex">#81D4FA</span>
            <button class="copy-btn" title="Copy color">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </article>
        <article class="color-card">
          <div class="color-preview" style="background-color: #4fc3f7"></div>
          <div class="color-details">
            <span class="hex">#4FC3F7</span>
            <button class="copy-btn" title="Copy color">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </article>
        <article class="color-card">
          <div class="color-preview" style="background-color: #29b6f6"></div>
          <div class="color-details">
            <span class="hex">#29B6F6</span>
            <button class="copy-btn" title="Copy color">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
        </article>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
