<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weekly Tasks</h1>

      <main class="board">
        <section class="list">
          <h2>To Do</h2>
          <div class="card" draggable="true">Complete Homework</div>
          <div class="card" draggable="true">Read Chapter 5</div>
        </section>
        <section class="list">
          <h2>In Progress</h2>
          <div class="card" draggable="true">Work on Science Project</div>
        </section>
        <section class="list">
          <h2>Completed</h2>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
