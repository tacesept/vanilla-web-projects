<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Start Screen -->
      <div class="start-screen screen active">
        <h1>Quiz Time!</h1>
        <p>Test your knowledge with these fun questions</p>
        <button class="start-btn">Start Quiz</button>
      </div>
      <!-- Quiz Screen -->
      <div class="quiz-screen screen">
        <div class="quiz-header">
          <h1 class="question-text">Question goes here</h1>
          <p class="quiz-info">
            <span>Question <span class="current-question">1</span> of <span class="total-questions">5</span></span>
            <span>Score: <span class="score">0</span></span>
          </div>
        </div>
        <div class="answers-container">
            <button class="answer-btn correct">Answer</button>
            <button class="answer-btn incorrect">Answer</button>
            <button class="answer-btn">Answer</button>
            <button class="answer-btn">Answer</button>
        </div>
        <div class="progress-bar">
          <div class="progress"></div>
        </div>
      </div>
      <!-- Result Screen -->
      <div class="result-screen screen">
        <h1>Quiz Results</h1>
        <div class="result-info">
            <p>You scored <span class="final-score">0</span> out of <span class="max-score">5</span></p>
            <p class="result-message">Good job!</p>
        </div>
        <button class="restart-quiz">Restart Quiz</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
